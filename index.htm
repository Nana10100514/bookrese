<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f6f2">

  <title>本屋にも、次回予約を。</title>

  <meta
    name="description"
    content="読み終わるころに、次の一冊と本屋で会うための次回予約サイト。"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <img
        class="campaign-logo"
        id="campaignLogo"
        src="./assets/logo.png"
        alt="本屋にも、次回予約を。"
      >

      <p
        class="logo-placeholder"
        id="logoFallback"
        hidden
      >
        本屋にも、次回予約を。
      </p>
    </header>

    <section
      class="books-section"
      aria-labelledby="historyTitle"
    >
      <h2
        class="section-label"
        id="historyTitle"
      >
        今までにあなたが購入した本
      </h2>

      <div class="books-strip">
        <div
          class="book-slider"
          id="bookSlider"
          aria-label="購入した本の一覧"
        >
          <a
            class="book-card"
            href="./book-detail.htm?book=1"
            aria-label="四畳半神話大系の購入情報を見る"
          >
            <div class="cover cover-indigo">
              <img
                src="./assets/books/book-01.jpg"
                alt="四畳半神話大系の表紙"
              >

              <span class="cover-placeholder">
                四畳半<br>神話大系
              </span>
            </div>

            <p>四畳半神話大系</p>
          </a>

          <a
            class="book-card"
            href="./book-detail.htm?book=2"
            aria-label="夜は短し恋せよ乙女の購入情報を見る"
          >
            <div class="cover cover-red">
              <img
                src="./assets/books/book-02.jpg"
                alt="夜は短し恋せよ乙女の表紙"
              >

              <span class="cover-placeholder">
                夜は短し<br>恋せよ乙女
              </span>
            </div>

            <p>夜は短し恋せよ乙女</p>
          </a>

          <a
            class="book-card"
            href="./book-detail.htm?book=3"
            aria-label="推し、燃ゆの購入情報を見る"
          >
            <div class="cover cover-blue">
              <img
                src="./assets/books/book-03.jpg"
                alt="推し、燃ゆの表紙"
              >

              <span class="cover-placeholder">
                推し、燃ゆ
              </span>
            </div>

            <p>推し、燃ゆ</p>
          </a>

          <a
            class="book-card"
            href="./book-detail.htm?book=4"
            aria-label="コンビニ人間の購入情報を見る"
          >
            <div class="cover cover-cream">
              <img
                src="./assets/books/book-04.jpg"
                alt="コンビニ人間の表紙"
              >

              <span class="cover-placeholder">
                コンビニ人間
              </span>
            </div>

            <p>コンビニ人間</p>
          </a>
        </div>

        <div
          class="slider-dots"
          id="sliderDots"
          aria-hidden="true"
        ></div>
      </div>
    </section>

    <section
      class="date-section"
      aria-labelledby="dateTitle"
    >
      <h2
        class="section-label"
        id="dateTitle"
      >
        おすすめの次回予約日
      </h2>

      <p
        class="wheel-guide"
        id="rouletteStatus"
        aria-live="polite"
      >
        読み終わるころを計算しています
      </p>

      <div class="date-wheel-wrap">
        <div
          class="date-wheel"
          id="dateWheel"
          role="listbox"
          aria-label="自動で選ばれるおすすめの次回予約日"
        ></div>

        <div
          class="wheel-focus"
          aria-hidden="true"
        ></div>
      </div>
    </section>

    <div class="booking-action">
      <a
        class="pill-button"
        id="reserveLink"
        href="./reservation.htm"
      >
        予約をする
      </a>
    </div>

    <section
      class="recommend-section"
      aria-labelledby="recommendTitle"
    >
      <h2
        class="section-label"
        id="recommendTitle"
      >
        おすすめの本
      </h2>

      <article class="recommend-card">
        <div class="recommend-cover cover-cream">
          <img
            src="./assets/books/recommend.jpg"
            alt="女生徒の表紙"
          >

          <span class="cover-placeholder">
            女生徒<br>太宰治
          </span>
        </div>

        <h3>
          『女生徒』
          <small>太宰治</small>
        </h3>

        <blockquote>
          「おやすみなさい。私は、王子さまのいないシンデレラ姫。
          あたし、東京の、どこにいるか、ごぞんじですか？」
        </blockquote>
      </article>

      <button
        class="search-button"
        id="searchButton"
        type="button"
      >
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            cx="10.7"
            cy="10.7"
            r="6.8"
          ></circle>

          <path d="m15.8 15.8 5 5"></path>
        </svg>

        次回予約する本を探す
      </button>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
